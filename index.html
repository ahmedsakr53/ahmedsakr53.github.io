<script>
(function(){

  var STR = {
    ar: {
      install: 'حمّل التطبيق', update: 'تحديث جديد متاح', refresh: 'تحديث',

      guideInAppTitle: 'افتح الموقع في المتصفح الأول',

    en: {
      install: 'Install app', update: 'Update available', refresh: 'Refresh',
      guideTitle: 'Install the app',
      guideInAppTitle: 'Open the site in your browser first',
      guideInAppSteps: ['Tap the three-dot menu (or the share button) in the app you are using now', 'Choose "Open in browser" (Chrome or Safari)', 'Once the site opens in the browser, tap "Install app" again'],
      guideAndroidSteps: ['Tap the three-dot menu at the top of Chrome', 'Choose "Install app" or "Add to Home screen"', 'Tap "Install" and you will find the Sakr icon on your phone'],
      guideIosSteps: ['Open the site in Safari (not inside WhatsApp or any app)', 'Tap the Share button (the square with an arrow) at the bottom', 'Scroll down and choose "Add to Home Screen"', 'Tap "Add" and you will find the Sakr icon on your phone'],
      guideClose: 'Got it'

  function s(k){ return STR[lang][k]; }
  window.pfSetLang = function(l){
    lang = l;
    var b = document.getElementById('pf-install');
    if (b) b.textContent = s('install');
    var t = document.getElementById('pf-update');
    if (t) { t.querySelector('span').textContent = s('update'); t.querySelector('button').textContent = s('refresh'); }
  };

  var deferred = null, installBtn = null;
  function standalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
  function showInstall(){
    if (installBtn || standalone()) return;
    installBtn = document.createElement('button');
    installBtn.id = 'pf-install';
    installBtn.className = 'pf-install-btn';
    installBtn.type = 'button';
    installBtn.textContent = s('install');
    installBtn.addEventListener('click', function(){
      if (deferred) {
        deferred.prompt();
        deferred.userChoice.finally(function(){ deferred = null; });
      } else {
        showHint();
      }
    });
    document.body.appendChild(installBtn);
  }
  function hideInstall(){ if (installBtn) { installBtn.remove(); installBtn = null; } }
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; showInstall(); });
  window.addEventListener('appinstalled', function(){ deferred = null; hideInstall(); });
  window.addEventListener('load', function(){ setTimeout(function(){ showInstall(); }, 2500); });
  function inAppBrowser(){
    var ua = navigator.userAgent || '';
    return /FBAN|FBAV|Instagram|WhatsApp|Telegram|Line\/|TikTok|Snapchat|Messenger/i.test(ua)
      || (/(iPhone|iPad|iPod)/.test(ua) && !/Safari/.test(ua))
      || (/Android/.test(ua) && /; wv\)/.test(ua));
  }
  function isIos(){
    return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function showHint(){
    if (document.getElementById('pf-install-hint')) return;
    var wrap = document.createElement('div');
    wrap.id = 'pf-install-hint';
    wrap.className = 'pf-install-sheet';
    var inApp = inAppBrowser(), ios = isIos();
    var title = inApp ? s('guideInAppTitle') : s('guideTitle');
    var steps = inApp ? s('guideInAppSteps') : (ios ? s('guideIosSteps') : s('guideAndroidSteps'));
    var html = '<div class="pf-install-card" role="dialog" aria-label="' + title + '">'
      + '<div class="pf-install-card-title">' + title + '</div>'
      + '<ol>' + steps.map(function(st){ return '<li>' + st + '</li>'; }).join('') + '</ol>'
      + '<button type="button" class="pf-install-close">' + s('guideClose') + '</button>'
      + '</div>';
    wrap.innerHTML = html;
    wrap.addEventListener('click', function(ev){ if (ev.target === wrap) wrap.remove(); });
    wrap.querySelector('.pf-install-close').addEventListener('click', function(){ wrap.remove(); });
    document.body.appendChild(wrap);
  }

  var BUILD = '2026-11-26-50'; var pending = false, dismissed = false, pendingWorker = null;
  function checkBuild(){
    fetch('version.json?t=' + Date.now(), {cache: 'no-store'}).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
      if (j && j.v && j.v !== BUILD) { pending = true; showUpdate(null); }
    }).catch(function(){});
  }
  var reloading = false;
  function goReload(){ if (reloading) return; reloading = true; try { location.reload(); } catch (e) { location.href = location.pathname; } }
  function hardRefresh(){
    // Always ends in a reload: every step is time-boxed so a stuck cache/SW call can never hang the button.
    var t = setTimeout(goReload, 2500);
    var step = function(pr){ return Promise.race([Promise.resolve(pr).catch(function(){}), new Promise(function(r){ setTimeout(r, 1500); })]); };
    var clr = window.caches ? caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }) : null;
    var rev = fetch(location.pathname, {cache: 'reload'});
    step(clr).then(function(){ return step(rev); }).then(function(){ clearTimeout(t); goReload(); });
  }
  window.addEventListener('load', function(){ setTimeout(checkBuild, 1500); });
  window.addEventListener('hashchange', function(){ if (pending && !dismissed) showUpdate(pendingWorker); });
  setInterval(function(){ if (pending && !dismissed) showUpdate(pendingWorker); else if (!document.hidden) checkBuild(); }, 45000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) checkBuild(); });

  function showUpdate(worker){
    pending = true; if (worker) pendingWorker = worker;
    if (dismissed || document.getElementById('pf-update')) return;
    var t = document.createElement('div');
    t.id = 'pf-update';
    t.className = 'pf-update-toast';
    var span = document.createElement('span');
    span.textContent = s('update');
    var btn = document.createElement('button');
    btn.className = 'pf-update-btn';
    btn.type = 'button';
    btn.textContent = s('refresh');
    btn.addEventListener('click', function(){ btn.disabled = true; btn.textContent = '...'; try { if (worker && worker.state === 'installed') worker.postMessage('SKIP_WAITING'); } catch (e) {} hardRefresh(); });
    var x = document.createElement('button');
    x.type = 'button'; x.className = 'pf-update-x'; x.setAttribute('aria-label', 'Close'); x.textContent = '\u00d7';
    x.addEventListener('click', function(){ dismissed = true; t.remove(); });
    t.appendChild(span);
    t.appendChild(btn);
    t.appendChild(x);
    document.body.appendChild(t);
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        reg.update().catch(function(){});
        setInterval(function(){ reg.update().catch(function(){}); }, 60 * 60 * 1000);
        document.addEventListener('visibilitychange', function(){ if (!document.hidden) reg.update().catch(function(){}); });
        if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
        reg.addEventListener('updatefound', function(){
          var w = reg.installing;
          if (!w) return;
          w.addEventListener('statechange', function(){
            if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w);
          });
        });
      }).catch(function(){});
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if (refreshing) return;
        refreshing = true;
        goReload();
      });
    });
  }
})();
